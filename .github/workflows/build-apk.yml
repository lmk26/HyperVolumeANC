name: Build APK

on:
  push:
    branches: [app-volume-entry-below-dnd]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Accept licenses and install SDK platform
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ls "$ANDROID_HOME" || true
          yes | "$SDKM" --licenses > /dev/null || true
          # compileSdk 37: the package id differs between SDK releases, so pick whatever exists.
          PKG=$("$SDKM" --list 2>/dev/null | grep -oE 'platforms;android-37[^ ]*' | sort -u | head -1 || true)
          echo "platform package: ${PKG:-none found}"
          if [ -n "$PKG" ]; then "$SDKM" "$PKG" || true; fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          set +e
          # The aliyun mirrors in settings.gradle.kts return 502 from GitHub's runners; use the official repos in CI only.
          sed -i '/maven.aliyun.com/d' settings.gradle.kts
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "error:|^e: |What went wrong|Could not|not found|FAILED" -A2 build.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: HyperVolumeANC-apk
          path: app/build/outputs/apk/release/*.apk
