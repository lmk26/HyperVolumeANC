name: Build APK

on:
  push:
    branches: [app-volume-entry-below-dnd]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Accept licenses and install SDK platform
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --list > sdk-list.txt 2>&1 || true
          echo "::notice::available platforms: $(grep -oE 'platforms;android-3[0-9][^ ]*' sdk-list.txt | sort -u | tr '\n' ' ')"
          # compileSdk 37: install every package id that looks like API 37.
          for PKG in $(grep -oE 'platforms;android-37[^ ]*' sdk-list.txt | sort -u); do
            echo "installing $PKG"
            "$SDKM" "$PKG" || echo "::warning::install of $PKG failed"
          done
          echo "::notice::installed platforms: $(ls "$ANDROID_HOME/platforms" | tr '\n' ' ')"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          set +e
          # The aliyun mirrors in settings.gradle.kts return 502 from GitHub's runners; use the official repos in CI only.
          sed -i '/maven.aliyun.com/d' settings.gradle.kts
          # The runner's SDK names the platform android-37.0, while AGP 8.9.2 looks for android-37.
          sed -i 's/compileSdk = 37/compileSdkPreview = "37.0"/' app/build.gradle.kts
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "error:|^e: |What went wrong|Could not|not found|FAILED" -A2 build.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: HyperVolumeANC-apk
          path: app/build/outputs/apk/release/*.apk
